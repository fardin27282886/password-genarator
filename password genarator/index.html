<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ultimate Secure Password Generator</h1>
            <p>Generate high-entropy passwords using Cryptographically Secure PRNG.</p>
        </header>

        <main class="generator-card">
            
            <div class="result-display">
                <input type="text" id="password-output" value="Click 'Generate' to begin" readonly aria-live="assertive">
                <button id="copy-btn" class="copy-btn" title="Copy to Clipboard" aria-label="Copy password to clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                </button>
            </div>

            <div class="strength-indicator" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="128" aria-labelledby="strength-label">
                <div class="strength-info">
                    <span>Password Strength:</span>
                    <span id="strength-label">Too Short</span>
                </div>
                <div id="strength-bar" class="strength-bar">
                    <div class="bar-fill"></div>
                </div>
                <div class="entropy-display">
                    <span id="entropy-value">0</span> bits
                </div>
            </div>

            <div class="controls">
                
                <div class="input-group slider-group">
                    <label for="length">Password Length: <span id="length-value">12</span></label>
                    <input type="range" id="length" value="12" min="8" max="64" step="1" aria-valuetext="Password length is 12">
                </div>
                
                <div class="input-group toggle-group mandatory">
                    <label>Numbers (67895432)</label>
                    <input type="checkbox" id="include-numbers" checked disabled hidden aria-checked="true">
                    <span class="toggle-switch mandatory-switch"></span>
                </div>

                <div class="input-group toggle-group mandatory">
                    <label>Symbols (@#$%)</label>
                    <input type="checkbox" id="include-symbols" checked disabled hidden aria-checked="true">
                    <span class="toggle-switch mandatory-switch"></span>
                </div>
                
                <div class="input-group toggle-group">
                    <label for="include-uppercase">Include Uppercase (A-Z)</label>
                    <input type="checkbox" id="include-uppercase" checked hidden>
                    <span class="toggle-switch"></span>
                </div>

                <div class="input-group toggle-group">
                    <label for="include-lowercase">Include Lowercase (a-z)</label>
                    <input type="checkbox" id="include-lowercase" checked hidden>
                    <span class="toggle-switch"></span>
                </div>

                <div class="input-group toggle-group special-setting">
                    <label for="exclude-ambiguous" class="alert-label">Exclude Ambiguous (l, 1, I, O, 0)</label>
                    <input type="checkbox" id="exclude-ambiguous" hidden>
                    <span class="toggle-switch"></span>
                </div>
            </div>

            <button id="generate-btn" class="btn-primary" aria-controls="password-output">Generate Ultra Secure Password</button>

            <div id="message-box" class="message-box" role="status"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
